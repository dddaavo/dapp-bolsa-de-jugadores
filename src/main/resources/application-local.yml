spring:
  datasource:
    url: jdbc:h2:mem:bolsadb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

logging:
  level:
    com.unq.dapp.bolsa: DEBUG

# Activar scraping real de WhoScored solo en local (Playwright + Chromium headless)
# Cambiar a true para obtener datos reales; false usa datos estáticos del fallback
whoscored:
  scraping:
    enabled: false

management:
  health:
    redis:
      enabled: false

