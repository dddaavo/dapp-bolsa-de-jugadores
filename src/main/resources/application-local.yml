spring:
  datasource:
    url: jdbc:h2:mem:bolsadb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    # H2Dialect se auto-detecta; no especificar para evitar deprecation warning
    show-sql: false

logging:
  level:
    com.unq.dapp.bolsa: DEBUG
