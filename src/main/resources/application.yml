server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: bolsa-de-jugadores
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: embedded
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        quotes.recalculation.duration: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    custom-css-url: /swagger-custom.css
  api-docs:
    path: /v3/api-docs

jwt:
  secret: ${JWT_SECRET:ZGV2LXNlY3JldC1rZXktcGxlYXNlLWNoYW5nZS1pbi1wcm9kdWN0aW9uLXRoaXMtaXMtZGV2LW9ubHk=}
  access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}

# Scraping WhoScored — desactivado por defecto para no romper CI ni startup en test
# Activar en local sobreescribiendo con: whoscored.scraping.enabled=true
whoscored:
  scraping:
    enabled: ${WHOSCORED_SCRAPING_ENABLED:false}

quote:
  recalc:
    cron: ${QUOTE_RECALC_CRON:0 0 3 * * MON}

external:
  sync:
    cron: ${EXTERNAL_SYNC_CRON:0 0 2 * * *}

app:
  seed:
    admin-password: ${APP_SEED_ADMIN_PASSWORD:admin1234}

