spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  cache:
    type: none
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

logging:
  level:
    root: WARN
    com.unq.dapp.bolsa: WARN

# Scraping siempre desactivado en tests: evita que Playwright intente
# descargar Chromium y que los tests dependan de red externa
whoscored:
  scraping:
    enabled: false
  seed:
    enabled: false

quote:
  recalc:
    cron: "-"

external:
  sync:
    cron: "-"

